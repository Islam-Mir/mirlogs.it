name: Deploy su InfinityFree

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Caricamento via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Scarica ultimo codice
        uses: actions/checkout@v4

      - name: Sincronizza file su InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
